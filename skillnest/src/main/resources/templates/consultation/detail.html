<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pkg.name})}"></head>
<body class="text-stone-800 flex flex-col min-h-screen">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="max-w-6xl mx-auto px-4 py-10 flex-1 w-full space-y-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <img th:src="${pkg.image}" class="w-full h-80 object-cover rounded-2xl shadow-sm" alt="Detail">
                <div class="bg-white p-6 rounded-2xl border border-stone-200 space-y-4">
                    <span class="px-3 py-1 bg-amber-100 text-[#D97757] rounded-full text-xs font-semibold" th:text="${pkg.category}"></span>
                    <h1 class="text-2xl md:text-3xl font-bold" th:text="${pkg.name}"></h1>
                    <p class="text-stone-600 text-sm leading-relaxed" th:text="${pkg.description}"></p>
                    <div class="grid grid-cols-3 gap-4 pt-4 border-t border-stone-100 text-sm">
                        <div><span class="text-xs text-stone-400 block">Chuyên viên phụ trách</span><strong th:text="${pkg.consultant}"></strong></div>
                        <div><span class="text-xs text-stone-400 block">Thời lượng tư vấn</span><strong th:text="${pkg.duration} + ' phút'"></strong></div>
                        <div><span class="text-xs text-stone-400 block">Hình thức</span><strong>Online / Offline Studio</strong></div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm h-fit space-y-5">
                <div>
                    <span class="text-xs text-stone-400">Chi phí gói tư vấn</span>
                    <div class="text-3xl font-bold text-[#D97757]" th:text="${#numbers.formatDecimal(pkg.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                </div>
                <a th:href="@{/cart/add/{id}(id=${pkg.id})}" class="block w-full text-center bg-[#7BA05B] hover:bg-[#688a4b] text-white font-semibold py-3 rounded-xl transition">+ Thêm vào Giỏ đặt lịch</a>
                <a href="/booking/form" class="block w-full text-center bg-[#D97757] hover:bg-[#c26345] text-white font-semibold py-3 rounded-xl transition">Đặt lịch hẹn trực tiếp</a>
            </div>
        </div>

        <!-- GÓI TƯ VẤN CÙNG LOẠI (MVC-04) -->
        <section>
            <h2 class="text-xl font-bold mb-4">Các Gói Tư Vấn Cùng Loại</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div th:each="r : ${relatedPackages}" class="bg-white p-4 rounded-xl border border-stone-200 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm" th:text="${r.name}"></h4>
                        <span class="text-xs text-[#D97757] font-semibold" th:text="${#numbers.formatDecimal(r.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>
                    <a th:href="@{/consultation/detail/{id}(id=${r.id})}" class="text-xs px-3 py-1.5 bg-stone-100 rounded-lg">Xem →</a>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
