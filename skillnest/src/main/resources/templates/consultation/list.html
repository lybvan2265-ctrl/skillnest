<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách Gói tư vấn - SkillNest')}"></head>
<body class="text-stone-800 flex flex-col min-h-screen">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
        <div class="mb-8">
            <h1 class="text-3xl font-bold">Danh Sách Gói Tư Vấn Nghề Nghiệp</h1>
            <p class="text-xs text-stone-500 mt-1">Tìm kiếm theo từ khóa, lọc theo chuyên ngành hoặc khoảng giá phù hợp</p>
        </div>

        <!-- BỘ LỌC TÌM KIẾM (MVC-03 & MVC-04) -->
        <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
            <form action="/consultation/search" method="get" class="flex gap-2">
                <input type="text" name="keyword" placeholder="Tìm theo tên gói tư vấn..." class="flex-1 border border-stone-300 rounded-lg px-3 py-2 text-sm">
                <button type="submit" class="bg-[#D97757] text-white px-4 py-2 rounded-lg text-xs font-semibold">Tìm</button>
            </form>

            <form action="/consultation/search-price" method="get" class="flex gap-2">
                <input type="number" name="min" placeholder="Giá từ (VNĐ)" class="w-1/2 border border-stone-300 rounded-lg px-3 py-2 text-sm">
                <input type="number" name="max" placeholder="Đến (VNĐ)" class="w-1/2 border border-stone-300 rounded-lg px-3 py-2 text-sm">
                <button type="submit" class="bg-[#2C2523] text-white px-4 py-2 rounded-lg text-xs font-semibold">Lọc giá</button>
            </form>

            <div class="flex items-center gap-2 overflow-x-auto">
                <a href="/consultation/list" class="px-3 py-1.5 bg-[#D97757] text-white rounded-lg text-xs font-semibold shrink-0">Tất cả</a>
                <a th:each="cat : ${categories}" th:href="@{/consultation/category/{id}(id=${cat})}" th:text="${cat}" class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 rounded-lg text-xs shrink-0"></a>
            </div>
        </div>

        <!-- THÔNG BÁO KHI RỖNG (th:if) -->
        <div th:if="${#lists.isEmpty(packages)}" class="bg-amber-50 border border-amber-200 p-8 rounded-2xl text-center text-amber-800">
            Không tìm thấy gói tư vấn nào phù hợp với điều kiện lọc.
        </div>

        <!-- DANH SÁCH GÓI TƯ VẤN (th:unless, th:each, th:classappend) -->
        <div th:unless="${#lists.isEmpty(packages)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div th:each="p : ${packages}" class="bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-sm flex flex-col">
                <div class="relative h-44">
                    <img th:src="${p.image}" class="w-full h-full object-cover" alt="Image">
                    <span th:text="${p.active ? 'Đang mở lịch' : 'Tạm ngưng'}"
                          th:classappend="${p.active ? 'bg-emerald-600 text-white' : 'bg-stone-500 text-white'}"
                          class="absolute top-3 right-3 px-2.5 py-0.5 rounded-full text-[10px] font-bold"></span>
                </div>
                <div class="p-5 flex-1 flex flex-col justify-between">
                    <div>
                        <span class="text-[11px] font-semibold text-[#7BA05B]" th:text="${p.category} + ' • ' + ${p.duration} + ' phút'"></span>
                        <h3 class="font-bold text-base mt-1 mb-1" th:text="${p.name}"></h3>
                        <p class="text-xs text-stone-500 mb-3" th:text="'CV: ' + ${p.consultant}"></p>
                    </div>
                    <div class="pt-3 border-t border-stone-100 flex justify-between items-center">
                        <span class="font-bold text-[#D97757]" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        <div class="flex gap-1.5">
                            <a th:href="@{/consultation/detail/{id}(id=${p.id})}" class="px-3 py-1.5 border border-stone-200 rounded-lg text-xs font-medium hover:bg-stone-50">Chi tiết</a>
                            <a th:href="@{/cart/add/{id}(id=${p.id})}" class="px-3 py-1.5 bg-[#D97757] text-white rounded-lg text-xs font-semibold">+ Đặt lịch</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PHÂN TRANG TEMPLATE (QUERY-02) -->
        <div class="mt-10 flex justify-between items-center text-xs text-stone-500 bg-white p-4 rounded-xl border border-stone-200">
            <span>Hiển thị trang 1 / 3 (Tổng 18 gói tư vấn)</span>
            <div class="flex gap-1.5">
                <button class="px-3 py-1.5 border rounded hover:bg-stone-50">First</button>
                <button class="px-3 py-1.5 border rounded hover:bg-stone-50">Previous</button>
                <button class="px-3 py-1.5 bg-[#D97757] text-white rounded font-bold">1</button>
                <button class="px-3 py-1.5 border rounded hover:bg-stone-50">Next</button>
                <button class="px-3 py-1.5 border rounded hover:bg-stone-50">Last</button>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
