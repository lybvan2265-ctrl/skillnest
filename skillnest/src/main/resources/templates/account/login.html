<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập & Quản lý Tài khoản')}"></head>
<body class="text-stone-800 flex flex-col min-h-screen">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-1 flex items-center w-full">
        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden grid grid-cols-1 md:grid-cols-2 w-full">
            <div class="p-8 space-y-4">
                <span class="text-xs font-bold uppercase text-[#D97757]">ACCOUNT-01 (/auth/login)</span>
                <h2 class="text-2xl font-bold">Đăng nhập Hệ thống</h2>
                <form action="/home/index" method="get" class="space-y-3.5 text-sm">
                    <div>
                        <label class="text-xs font-semibold text-stone-500">Tên đăng nhập (Username)</label>
                        <input type="text" value="student01" required class="w-full border border-stone-300 rounded-lg px-3 py-2 mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-stone-500">Mật khẩu (Password)</label>
                        <input type="password" value="123456" required class="w-full border border-stone-300 rounded-lg px-3 py-2 mt-1">
                    </div>
                    <button type="submit" class="w-full bg-[#D97757] text-white font-semibold py-2.5 rounded-lg">Đăng nhập</button>
                </form>
            </div>

            <div class="p-8 bg-stone-50 border-t md:border-t-0 md:border-l border-stone-200 space-y-4">
                <span class="text-xs font-bold uppercase text-[#7BA05B]">Đăng ký Thành viên (/account/sign-up)</span>
                <h2 class="text-xl font-bold">Tạo Tài Khoản Sinh Viên</h2>
                <form action="/auth/login" method="get" class="space-y-3 text-sm">
                    <input type="text" placeholder="Username" class="w-full border border-stone-300 rounded-lg px-3 py-2 bg-white">
                    <input type="text" placeholder="Họ và tên (Fullname)" class="w-full border border-stone-300 rounded-lg px-3 py-2 bg-white">
                    <input type="email" placeholder="Email sinh viên" class="w-full border border-stone-300 rounded-lg px-3 py-2 bg-white">
                    <input type="password" placeholder="Mật khẩu" class="w-full border border-stone-300 rounded-lg px-3 py-2 bg-white">
                    <button type="submit" class="w-full bg-[#2C2523] text-white font-semibold py-2.5 rounded-lg">Đăng ký Tài khoản</button>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
